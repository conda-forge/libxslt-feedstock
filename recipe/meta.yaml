{% set version = "1.1.45" %}

package:
  name: libxslt
  version: {{ version }}

source:
  url: https://download.gnome.org/sources/libxslt/{{ version[0:3] }}/libxslt-{{ version }}.tar.xz
  sha256: 9acfe68419c4d06a45c550321b3212762d92f41465062ca4ea19e632ee5d216e
  patches:
    - 0001-Make-and-install-a-pkg-config-file-on-Windows.patch
    - 0002-win-profiler-config.patch

build:
  number: 2
  run_exports:
    # forward compatible: https://abi-laboratory.pro/tracker/timeline/libxslt/
    - {{ pin_subpackage('libxslt') }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - gnuconfig  # [unix]
    # The Windows build uses nmake, not GNU make.  Keep the existing tools on
    # established targets, but do not make the new Windows ARM64 build wait on
    # packages that its build script does not need.
    - make  # [target_platform != "win-arm64"]
    - pkg-config  # [target_platform != "win-arm64"]
  host:
    - libxml2-devel

test:
  requires:
    - pkg-config  # [target_platform != "win-arm64"]
    - {{ compiler('c') }}  # [target_platform == "win-arm64"]
    - libxml2-devel
  files:
    - test.c  # [target_platform == "win-arm64"]
  commands:
    - xsltproc --version
    - pkg-config --cflags libxslt libexslt  # [target_platform != "win-arm64"]
    - pkg-config --libs libxslt libexslt  # [target_platform != "win-arm64"]
    - if not exist %LIBRARY_INC%\libxslt\xslt.h exit 1  # [target_platform == "win-arm64"]
    - if not exist %LIBRARY_LIB%\libxslt.lib exit 1  # [target_platform == "win-arm64"]
    - if not exist %LIBRARY_LIB%\libexslt.lib exit 1  # [target_platform == "win-arm64"]
    - if not exist %LIBRARY_LIB%\pkgconfig\libxslt.pc exit 1  # [target_platform == "win-arm64"]
    - if not exist %LIBRARY_LIB%\pkgconfig\libexslt.pc exit 1  # [target_platform == "win-arm64"]
    - call %CC% /nologo /I"%LIBRARY_INC%" /I"%LIBRARY_INC%\libxml2" test.c /link /LIBPATH:"%LIBRARY_LIB%" libxslt.lib /OUT:test.exe  # [target_platform == "win-arm64"]
    - if errorlevel 1 exit 1  # [target_platform == "win-arm64"]
    - test.exe  # [target_platform == "win-arm64"]
    - dumpbin /headers test.exe | findstr /I /C:"AA64 machine (ARM64)"  # [target_platform == "win-arm64"]

about:
  home: https://gitlab.gnome.org/GNOME/libxslt
  license: MIT
  license_file: Copyright
  summary: The XSLT C library developed for the GNOME project
  description: |
    "Libxslt is the XSLT C library developed for the GNOME project.
    XSLT itself is a an XML language to define transformation for XML.
    Libxslt is based on libxml2-devel the XML C library developed for the GNOME project.
    It also implements most of the EXSLT set of processor-portable extensions functions
    and some of Saxon's evaluate and expressions extensions."
  doc_url: https://gitlab.gnome.org/GNOME/libxslt/-/wikis
  dev_url: https://gitlab.gnome.org/GNOME/libxslt
  doc_source_url: https://github.com/GNOME/libxslt/tree/master/doc

extra:
  recipe-maintainers:
    - zklaus
    - mbargull
    - ocefpaf
    - scopatz
